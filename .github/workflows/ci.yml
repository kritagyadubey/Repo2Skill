name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 is not published for ubuntu-26.04 yet, so pin that job to 24.04.
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate the engine skill
        run: python skills/repo2skill/scripts/validate_skill.py skills/repo2skill

      - name: Secret scan
        run: python skills/repo2skill/scripts/scan_secrets.py .
